{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my recipes</title>
    <link rel="icon" type="image/x-icon" href="./img/wasfa-high-resolution-logo-black.png">
    <link rel="stylesheet" href="{% static './css/styling.css'%}">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/recipes-out-style.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'img/wasfa-high-resolution-logo-black.png' %}">
    <link rel="stylesheet" href="{% static 'css/styling.css' %}">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
{% include 'parts\admin_navbar.html'%}


{% block content %}
<center>
<h1>Your Recipes</h1>
<ul id="recipe-list">
    <table>
        <th>name</th>
        <th>type</th>
        <th>details</th>
        <th>      </th>
    {% for recipe in recipes %}
                <tr>
                    <td>{{ recipe.name }}</td>
                    <td>{{ recipe.course_type }}</td>
                    <td><a href="{% url 'recipe_detail' slug=recipe.slug %}">View Recipe</a></td>
                    <td>
                        <a href="{% url 'edit_recipe' recipe.id %}">Edit</a>
                        <button class="delete-recipe" data-id="{{ recipe.id }}">Delete</button>
                    </td>
                </tr>
        {% endfor %}
    </table>
</ul>
</center>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const buttons = document.querySelectorAll('.delete-recipe');
        buttons.forEach(button => {
            button.addEventListener('click', function() {
                const recipeId = this.getAttribute('data-id');
                const confirmed = confirm('Are you sure you want to delete this recipe?');
                if (confirmed) {
                    fetch(`/delete-recipe/${recipeId}/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}',
                        },
                        body: JSON.stringify({})
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            // Remove the recipe row from the table
                            const row = this.closest('tr');
                            row.remove();
                        } else {
                            alert(data.message);
                        }
                    });
                }
            });
        });
    });
    </script>
{% endblock %}
